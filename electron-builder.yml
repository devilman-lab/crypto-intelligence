appId: com.cryptointelligence.app
productName: Crypto Intelligence
copyright: Copyright © 2026 Crypto Intelligence
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}*'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/better-sqlite3/{src,deps,build}/**'
extraResources:
  - from: resources/icons/icon.png
    to: icon.png
asarUnpack:
  - node_modules/better-sqlite3/**
# better-sqlite3 ships Node-API prebuilds; no node-gyp rebuild is needed or possible on machines without a C++ toolchain.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/icon.ico
  # Artifact names are set per target so the installer and the portable exe never collide.
nsis:
  artifactName: Crypto-Intelligence-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Crypto Intelligence
# Single self-extracting executable. It unpacks to a per-launch %TEMP% folder, runs the app with
# PORTABLE_EXECUTABLE_DIR set (see electron/main/dataLocation.ts) and cleans up on exit.
portable:
  artifactName: Crypto-Intelligence-Portable-${version}.${ext}
  requestExecutionLevel: user
publish:
  provider: github
  owner: crypto-intelligence
  repo: crypto-intelligence
  releaseType: release
